<script>
// When user submits the form, save their data to localStorage
document.querySelector("form").addEventListener("submit", function() {
  const formData = new FormData(this);
  const data = {};
  formData.forEach((value, key) => data[key] = value);
  localStorage.setItem("formData", JSON.stringify(data));
});
</script>


<script>
// On page load, fill form if saved data exists
window.addEventListener("load", function() {
  const saved = JSON.parse(localStorage.getItem("formData"));
  if (saved) {
    for (const key in saved) {
      const input = document.querySelector(`[name="${key}"]`);
      if (input) input.value = saved[key];
    }
  }
});
</script>



  <script>
  const whatYouWant = document.getElementById("whatYouWant");
  const websiteTypeGroup = document.getElementById("websiteTypeGroup");
  const gameTypeGroup = document.getElementById("gameTypeGroup");

  whatYouWant.addEventListener("change", function () {
    const value = this.value;

    // Reset visibility first
    websiteTypeGroup.classList.add("hidden");
    gameTypeGroup.classList.add("hidden");

    if (value === "website") {
      websiteTypeGroup.classList.remove("hidden");
    } else if (value === "game") {
      gameTypeGroup.classList.remove("hidden");
    } else if (value === "both") {
      websiteTypeGroup.classList.remove("hidden");
      gameTypeGroup.classList.remove("hidden");
    }
  });
</script>

<script>

</script>


<script>

  function toggleChat() {
    const box = document.getElementById('chatBox');
    box.classList.toggle('hidden');
  }

  function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    const chat = document.getElementById('chatMessages');

    const userMsg = document.createElement("div");
    userMsg.classList.add("message", "user");
    userMsg.textContent = msg;
    chat.appendChild(userMsg);

    input.value = '';
    chat.scrollTop = chat.scrollHeight;

    // Dummy Alex reply
    setTimeout(() => {
      const reply = document.createElement("div");
      reply.classList.add("message", "alex");
      reply.textContent = "Great! We'll review it and get back to you soon.";
      chat.appendChild(reply);
      chat.scrollTop = chat.scrollHeight;
    }, 800);
  }
</script>
<script>
  // Step toggles
  const goStep1 = document.getElementById("goStep1");
  const goStep2 = document.getElementById("goStep2");
  const step1 = document.getElementById("step1");
  const step2 = document.getElementById("step2");
  const nextBtn = document.getElementById("nextBtn");
  const form1 = document.getElementById("formStep1");
  const form2 = document.getElementById("formStep2");

  // Show Step 1
  goStep1.addEventListener("click", () => {
    step1.style.display = "block";
    step2.style.display = "none";
    goStep1.classList.add("active");
    goStep2.classList.remove("active");
  });

  // Show Step 2 (if Step 1 is valid)
  goStep2.addEventListener("click", () => {
    if (form1.checkValidity()) {
      step1.style.display = "none";
      step2.style.display = "block";
      goStep2.classList.add("active");
      goStep1.classList.remove("active");
    } else {
      form1.reportValidity();
    }
  });

  // Next button
  nextBtn.addEventListener("click", () => {
    if (form1.checkValidity()) {
      step1.style.display = "none";
      step2.style.display = "block";
      goStep2.classList.add("active");
      goStep1.classList.remove("active");
    } else {
      form1.reportValidity();
    }
  });

  // Final form submission: ensure both forms are valid
  form2.addEventListener("submit", (e) => {
    if (!form1.checkValidity()) {
      e.preventDefault();
      step1.style.display = "block";
      step2.style.display = "none";
      goStep1.classList.add("active");
      goStep2.classList.remove("active");
      form1.reportValidity();
      return;
    }

    if (!form2.checkValidity()) {
      e.preventDefault();
      form2.reportValidity();
      return;
    }

    // ✅ Both steps are valid — form will submit normally
  });

  // Optional: auto toggle visibility styles (add CSS .hidden if needed)
  step1.style.display = "block";
  step2.style.display = "none";
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const formStep1 = document.getElementById("formStep1");
    const step1 = document.getElementById("step1");
    const step2 = document.getElementById("step2");

    const goStep1 = document.getElementById("goStep1");
    const goStep2 = document.getElementById("goStep2");
    const progressFill = document.getElementById("progressFill");
    const nextBtn = document.getElementById("nextBtn");

    if (goStep1) {
      goStep1.addEventListener("click", () => {
        step1.style.display = "block";
        step2.style.display = "none";
        goStep1.classList.add("active");
        goStep2.classList.remove("active");
        progressFill.style.width = "50%";
      });
    }

    if (goStep2) {
      goStep2.addEventListener("click", () => {
        if (formStep1.checkValidity()) {
          step1.style.display = "none";
          step2.style.display = "block";
          goStep1.classList.remove("active");
          goStep2.classList.add("active");
          progressFill.style.width = "100%";
        } else {
          formStep1.reportValidity();
        }
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        if (formStep1.checkValidity()) {
          step1.style.display = "none";
          step2.style.display = "block";
          goStep1.classList.remove("active");
          goStep2.classList.add("active");
          progressFill.style.width = "100%";
        } else {
          formStep1.reportValidity();
        }
      });
    }
  });
</script>


<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("formStep2");
  const submitBtn = form.querySelector(".btn");

  // All required field IDs (excluding optional)
  const requiredFields = [
    "name", "email", "phone", "country", "brand",
    "whatYouWant", "description", "budget"
  ];

  // Check if all required fields are filled
  function isFormComplete() {
    return requiredFields.every(id => {
      const field = document.getElementById(id);
      return field && field.value.trim() !== "";
    });
  }

  // Update button state based on form input
  form.addEventListener("input", () => {
    if (isFormComplete()) {
      submitBtn.disabled = false;
      submitBtn.style.opacity = "1";
      submitBtn.style.cursor = "pointer";
    } else {
      submitBtn.disabled = true;
      submitBtn.style.opacity = "0.6";
      submitBtn.style.cursor = "not-allowed";
    }
  });

 
  // Initial state
  submitBtn.disabled = true;
  submitBtn.style.opacity = "0.6";
  submitBtn.style.cursor = "not-allowed";
});
</script>




<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("formStep2");
  const submitBtn = form.querySelector(".btn");
  const webhookURL = "https://shakaop11.app.n8n.cloud/webhook/register-form";

  submitBtn.addEventListener("click", async (e) => {
    e.preventDefault();

    const data = {
      name: document.getElementById("name")?.value.trim() || "",
      email: document.getElementById("email")?.value.trim() || "",
      phone: document.getElementById("phone")?.value.trim() || "",
      country: document.getElementById("country")?.value.trim() || "",
      brand: document.getElementById("brand")?.value.trim() || "",
      whatYouWant: document.getElementById("whatYouWant")?.value.trim() || "",
      websiteType: document.getElementById("websiteType")?.value.trim() || "",
      gameType: document.getElementById("gameType")?.value.trim() || "",
      description: document.getElementById("description")?.value.trim() || "",
      budget: document.getElementById("budget")?.value.trim() || "",
      deadline: document.getElementById("deadline")?.value.trim() || "",
      discount: document.getElementById("discount")?.value.trim() || ""
    };

    try {
      const response = await fetch(webhookURL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      // Even if webhook returns no JSON, ignore it and redirect
      console.log("Webhook Response:", await response.text());

      // Always redirect if request was sent
      if (response.ok) {
        window.location.href = "thankyou.html";
      } else {
        // still redirect to keep UX clean
        window.location.href = "thankyou.html";
      }

    } catch (error) {
      console.error("Fetch Error:", error);
      // still redirect even if fetch fails
      window.location.href = "thankyou.html";
    }
  });
});
</script>
